<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>OnniCode</title>
    <style>
      /* The boot surface, in the same grammar as the cockpit's loading splash
         (packages/web/src/components/loading-splash.tsx): the mark, the wordmark, one status
         line, and a hairline track with a single violet sweep. Dark is the cockpit's default,
         light follows the system — the splash cannot read the cockpit's saved theme (different
         origin), so this is the closest honest match. Tokens mirror styles/index.css. */
      :root {
        --bg: #090909;
        --fg: #ededed;
        --muted: #8a8a8a;
        --soft: #6b6b6b;
        --line: #242424;
        --panel: rgba(255, 255, 255, 0.03);
        --violet: #8f86e8;
        --on-violet: #0d0d0d;
        --tile: #ffffff;
        --danger: #ff8a7a;
        --sans: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --mono: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fafafa;
          --fg: #171717;
          --muted: #6b6b6b;
          --soft: #8a8a8a;
          --line: #e4e4e4;
          --panel: rgba(0, 0, 0, 0.025);
          --violet: #6d5fd6;
          --on-violet: #ffffff;
          --tile: transparent;
          --danger: #c2412d;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 13.5px/1.5 var(--sans);
        -webkit-font-smoothing: antialiased;
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }
      /* The same 28px title strip the cockpit paints under the traffic lights, draggable. */
      .titlebar {
        position: fixed;
        inset: 0 0 auto 0;
        height: 28px;
        z-index: 3;
      }

      main {
        height: 100%;
        display: grid;
        place-items: center;
        padding: 44px 24px 60px;
        box-sizing: border-box;
      }
      .stage {
        width: min(360px, 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }

      .mark {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        background: var(--tile);
      }
      .name {
        margin: 18px 0 0;
        font: 600 17px/1 var(--sans);
        letter-spacing: -0.01em;
        color: var(--fg);
      }
      h1 {
        margin: 14px 0 0;
        font: 500 12px/1.5 var(--mono);
        letter-spacing: 0;
        color: var(--muted);
      }
      .detail {
        margin: 4px 0 0;
        max-width: 100%;
        color: var(--soft);
        font: 11.5px/1.55 var(--sans);
        overflow-wrap: anywhere;
      }

      .progress {
        position: relative;
        width: 160px;
        height: 2px;
        margin-top: 16px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }
      .progress .track {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: var(--violet);
        animation: sweep 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      pre {
        -webkit-user-select: text;
        user-select: text;
        text-align: left;
        width: 100%;
        box-sizing: border-box;
        margin: 18px 0 0;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        color: var(--muted);
        font: 11px/1.6 var(--mono);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 32vh;
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 18px;
      }
      .button {
        appearance: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 14px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--fg);
        font: 600 12px/1 var(--sans);
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .button.restart {
        border-color: transparent;
        background: var(--violet);
        color: var(--on-violet);
      }
      .button:hover {
        background: color-mix(in oklab, var(--violet) 12%, transparent);
      }
      .button.restart:hover {
        filter: brightness(1.08);
      }
      .button:focus-visible {
        outline: 2px solid var(--violet);
        outline-offset: 2px;
      }
      .button[disabled] {
        opacity: 0.6;
        cursor: default;
      }
      .hidden {
        display: none !important;
      }

      /* ---- failure state ----------------------------------------------------------- */
      body.failed .name {
        color: var(--danger);
      }
      body.failed .progress .track {
        animation: none;
        width: 100%;
        opacity: 0.45;
        background: var(--danger);
      }
      /* Every failure page: the error sentence wraps instead of truncating. */
      body.failed .detail {
        white-space: normal;
        font-family: var(--mono);
        font-size: 11px;
        text-align: left;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
      }

      @keyframes sweep {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(360%);
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .stage {
          animation: none;
        }
        .progress .track {
          animation: none;
          width: 100%;
          opacity: 0.45;
        }
      }

      /* ---- compact windows --------------------------------------------------------- */
      @media (max-height: 560px), (max-width: 640px) {
        main {
          padding-bottom: 32px;
        }
        .mark {
          width: 52px;
          height: 52px;
          border-radius: 12px;
        }
        .name {
          margin-top: 14px;
        }
        pre {
          max-height: 38vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="titlebar" data-tauri-drag-region></div>
    <main>
      <section class="stage" aria-live="polite">
        <img class="mark" src="icon.svg" alt="" aria-hidden="true" width="64" height="64" />
        <p class="name">OnniCode</p>
        <h1 id="title">Starting OnniCode…</h1>
        <p id="detail" class="detail">Launching the local cockpit.</p>
        <div id="spinner" class="progress" role="progressbar" aria-label="Starting OnniCode"><span class="track"></span></div>
        <pre id="log" class="hidden"></pre>
        <div id="actions" class="actions hidden">
          <button id="retry" class="button restart" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
            <span id="retry-label">Restart OnniCode</span>
          </button>
        </div>
      </section>
    </main>
    <script>
      // The Rust side drives this page through `eval` — no Tauri IPC is needed for a splash.
      window.onniSplash = {
        set(title, detail) {
          document.getElementById('title').textContent = title
          const line = document.getElementById('detail')
          line.textContent = detail
          line.title = detail
        },
        fail(title, detail, log) {
          this.set(title, detail)
          document.body.classList.add('failed')
          document.getElementById('spinner').classList.add('hidden')
          const pre = document.getElementById('log')
          pre.textContent = log || ''
          pre.classList.toggle('hidden', !log)
        },
      }
      const params = new URLSearchParams(location.search)
      // Every failure page: the error, its log and "Restart OnniCode" — which restarts the app
      // (`restart_app`).
      if (params.get('error')) {
        window.onniSplash.fail(params.get('title') || 'OnniCode stopped', params.get('error'), params.get('log') || '')
        document.getElementById('actions').classList.remove('hidden')
        document.getElementById('retry').onclick = function () {
          const label = document.getElementById('retry-label')
          this.disabled = true
          label.textContent = 'Restarting…'
          if (window.__TAURI_INTERNALS__) window.__TAURI_INTERNALS__.invoke('restart_app')
        }
      } else if (params.get('title')) {
        window.onniSplash.set(params.get('title'), params.get('detail') || '')
      }
    </script>
  </body>
</html>
