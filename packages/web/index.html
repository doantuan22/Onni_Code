<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget: engines that honor it shrink the viewport under the virtual
         keyboard themselves; the visualViewport --kb watcher (lib/keyboard-inset.ts) is the
         required iOS fallback beneath it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Relative so Vite bundles the legacy logo out of web/ instead of duplicating it under a public dir. -->
    <link rel="icon" href="/icon.svg" />
    <title>OnniCode</title>
    <!-- Theme before first paint — no flash. Mirrors resolveTheme()/applyResolvedTheme() in
         src/lib/theme.ts; keep the two in sync. Shares the legacy cockpit's `onni-theme` key
         ('light' | 'dark' | 'system'); anything else falls back to light (the default). -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('onni-theme')
          var light =
            pref === 'system'
              ? matchMedia('(prefers-color-scheme: light)').matches
              : pref !== 'dark'
          document.documentElement.classList.toggle('light', light)
          document.documentElement.style.colorScheme = light ? 'light' : 'dark'
        } catch (e) {
          // Storage or matchMedia unavailable — fall back to the default (light).
          document.documentElement.classList.add('light')
          document.documentElement.style.colorScheme = 'light'
        }
        // Appearance before first paint, from the localStorage MIRROR of ui-state.json
        // (src/lib/appearance.ts owns the contract; keep the two in sync). Defaults are the
        // absence of the attribute, so only the known deviations are stamped. A pre-upgrade
        // `onni-width=narrow` mirror can flash once before the server migration settles.
        try {
          if (localStorage.getItem('onni-accent') === 'violet')
            document.documentElement.dataset.accent = 'violet'
          var density = localStorage.getItem('onni-density')
          if (density === 'compact' || density === 'ultra')
            document.documentElement.dataset.density = density
          if (localStorage.getItem('onni-width') === 'narrow')
            document.documentElement.dataset.width = 'narrow'
          var scene = JSON.parse(localStorage.getItem('onni-scene') || 'null')
          var sceneIds = [
            'vn-halong', 'vn-mu-cang-chai', 'vn-fansipan', 'vn-phu-quoc',
            'world-tromso', 'world-kyoto', 'world-matterhorn', 'world-sahara'
          ]
          document.documentElement.dataset.scene =
            scene && scene.on === true && sceneIds.indexOf(scene.id) !== -1 ? 'on' : 'off'
        } catch (e) {
          // Storage unavailable — appearance defaults already apply.
          document.documentElement.dataset.scene = 'off'
        }
      })()
    </script>
    <!-- First paint, before the bundle loads: the same splash the app shows while a route
         chunk resolves (components/loading-splash.tsx), so booting never flashes an empty
         page. Inline on purpose — the token stylesheet arrives with the JS. Colors mirror
         styles/index.css; React clears #root on mount and the cockpit takes over. -->
    <style>
      .onni-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #090909;
        color: #ededed;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      html.light .onni-boot {
        background: #fafafa;
        color: #171717;
      }
      .onni-boot-mark {
        width: 56px;
        height: 56px;
        border-radius: 10px;
        background: #ffffff;
      }
      html.light .onni-boot-mark {
        background: transparent;
      }
      .onni-boot-mark {
        animation: onni-boot-breathe 1.8s ease-in-out infinite;
      }
      @keyframes onni-boot-breathe {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.97);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .onni-boot-mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="onni-boot" role="status" aria-label="Starting OnniCode">
        <img class="onni-boot-mark" src="/icon.svg" alt="" width="56" height="56" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
